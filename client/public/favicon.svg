<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Plate / Badge -->
  <defs>
    <linearGradient id="findit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#findit-grad)" filter="url(#shadow)" />

  <!-- Finding Icon: Magnifying Lens with Target / Spark Center -->
  <!-- Search Glass Lens -->
  <circle cx="28" cy="28" r="13" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Target Center Dot / Pin for Finding -->
  <circle cx="28" cy="28" r="3.5" fill="#93c5fd" />
  
  <!-- Search Handle -->
  <line x1="38" y1="38" x2="49" y2="49" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Accent Radar / Discovery Sparkle -->
  <path d="M43 17 L44.5 21 L48.5 22.5 L44.5 24 L43 28 L41.5 24 L37.5 22.5 L41.5 21 Z" fill="#60a5fa" opacity="0.9" />
</svg>
